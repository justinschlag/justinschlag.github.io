<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Make Justin Happy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Make Justin Happy</h1>

  <div id="justin-image-container">
    <img id="justin-image" src="../images/neutral new.jpeg" alt="Justin Neutral">
    <div id="tear" class="tear" style="display: none;"></div>
  </div>

  <div id="controls">
    <input id="user-input" type="text" placeholder="Say something to Justin…" />
    <button id="submit-btn">Send</button>
    <div id="status-text">Justin is neutral.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    const imageEl = document.getElementById('justin-image');
    const input = document.getElementById('user-input');
    const button = document.getElementById('submit-btn');
    const status = document.getElementById('status-text');
    const tear = document.getElementById('tear');

    function launchConfetti() {
      confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
    }

    function normalizeText(s) {
      return (s || "")
        .toLowerCase()
        .replace(/[“”]/g, '"')
        .replace(/[’]/g, "'")
        .trim();
    }

    function includesAnyPhrase(text, phrases) {
      for (const p of phrases) {
        if (text.includes(p)) return true;
      }
      return false;
    }

    // IMPORTANT FIX #1:
    // Your sadWords regex had a trailing "|" before the closing paren: "...|lonely|)\b"
    // That creates an EMPTY alternative which matches basically anywhere => EVERYTHING becomes "sad" (including "hi").
    // This list is cleaned and also removes super-broad triggers like lone "not".
    const happyWords = /\b(thank|thanks|great|awesome|glad|impressive|happy|happiness|cool|love|nice|funny|haha|lol|beautiful|smart|amazing|yay|yes|yeah|yep|wonderful|fantastic|adorable|cute|sweet|success|proud|relieved|smile|laugh|laughing|enjoy|peaceful|calm|grateful|excited|fun|win|winning|accomplished|blessed|chill|lovely|sunshine|perfect|positive|wholesome|joy|joyful|ecstatic|vibes|vibing|good|best|bright|elated|content|delighted|glorious|highlight|sparkle|glee|euphoric|hyped|pumped|enthusiastic|smiling|rockstar|genius|talented|supportive|encouraging|inspired|inspiring|upbeat|sunny|lit|dope|fire|banger|excellent|adoring|sweetheart|golden|flawless|heartwarming|kudos|celebrate|achievement|goals|vacation|wow|promotion|loves|handsome|madeleine)\b/;

    const happyPhrases = [
      "good job", "really proud", "great time", "feeling good", "got this",
      "big day", "cool project", "passion project", "new puppy", "new job",
      "got promoted", "i got in", "got accepted", "made it through",
      "peace of mind", "better now", "i’m back", "i'm back", "good grade",
      "on track", "working hard", "hyped up", "first place", "new record",
      "beautiful day", "good vibes", "inner peace", "top tier", "chef’s kiss",
      "chef's kiss", "sweet moment", "positive energy", "winning streak"
    ];

    const sadWords = /\b(sad|mean|ugly|bad|hate|disappointed|disappointing|offensive|cringe|weird|hurt|sucks?|stupid|dumb|rude|ouch|dead|died|lonely|alone|anxious|anxiety|depressed|depression|cry|cried|cries|crying|tears|worried|afraid|scared|angry|mad|terrible|awful|miserable|sick|ill|pain|fail|failed|failure|crap|garbage|worthless|regret|sorry|broken|hopeless|dark|grief|mourning|burned|stressed|panic|overwhelmed|emotional|shattered|heartbroken|ignored|ghosted|abandoned|jobless|laid\s*off|fired|ashamed|broke|cheated|lied|manipulated|gaslit|abused|toxic|ruined|exhausted|pointless|suffering|isolated|lost|worrying|blamed|let\s*down|helpless|nobody|forgotten|giving\s*up|worst)\b/;

    const sadPhrases = [
      "passed away", "funeral", "left out", "lost my", "divorce", "breakup",
      "i miss", "bad grade", "failed test", "failed exam", "got denied",
      "hurt my", "they left", "woke up crying", "can't sleep", "can’t sleep",
      "no motivation", "struggling", "burnt out", "worried sick", "feeling down",
      "feeling low", "messed up", "ruined everything", "nothing works",
      "can't handle", "can’t handle", "powerless", "crying again", "why me",
      "i hate life", "feel empty", "getting worse", "mentally tired",
      "physically tired", "lost hope", "end it", "wasting away",
      "emotional damage", "trouble sleeping", "everything hurts", "lost faith",
      "why bother", "heartache", "hurts too much", "never good enough",
      "can't win", "can’t win", "not okay", "not okay."
    ];

    // IMPORTANT FIX #2:
    // Treat tiny greetings / simple requests as neutral (or happy if you want).
    // This prevents the AI fallback from doing something weird.
    const greetingRegex = /^(hi|hey|hello|yo|sup|what's up|whats up|hiya|howdy|good morning|good afternoon|good evening)\b[!.?\s]*$/i;

    function extractMoodWord(answerText) {
      const t = normalizeText(answerText);
      // Grab the first occurrence of a valid mood word, even if the bot rambles.
      if (/\bhappy\b/.test(t)) return "happy";
      if (/\bsad\b/.test(t)) return "sad";
      if (/\bneutral\b/.test(t)) return "neutral";
      return "neutral";
    }

    async function askJustinBotMood(message) {
      // Timeout so the UI doesn't hang forever
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      try {
        const res = await fetch('https://justin-bot-ujmo.onrender.com/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            question:
              `You are a strict mood classifier for a tiny web app.
Return ONLY ONE WORD: happy, sad, or neutral.

Rules:
- Greetings like "hi", "hey", "hello" => neutral.
- If it's unclear/ambiguous => neutral.
- "sad" ONLY for clearly negative/hurtful/distressing text.
- "happy" for clearly positive/compliments/celebrations.
- Otherwise neutral.

Text: ${message}`
          })
        });

        const data = await res.json();
        return extractMoodWord(data?.answer || "");
      } catch (err) {
        // If anything fails (network/timeout), default to neutral (never sad).
        return "neutral";
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function evaluateMood() {
      const rawMessage = input.value;
      const message = rawMessage.trim();
      if (!message) return;

      status.textContent = "Hmmmmmmmm......";

      const lower = normalizeText(message);
      let mood = "neutral";

      // Quick neutral for greetings / tiny inputs
      if (greetingRegex.test(message) || lower.length <= 2) {
        mood = "neutral";
      } else if (happyWords.test(lower) || includesAnyPhrase(lower, happyPhrases)) {
        mood = "happy";
      } else if (sadWords.test(lower) || includesAnyPhrase(lower, sadPhrases)) {
        mood = "sad";
      } else {
        mood = await askJustinBotMood(message);
      }

      if (mood === "happy") {
        imageEl.src = "../images/happy new.jpeg";
        imageEl.alt = "Justin Happy";
        status.textContent = "Justin is happy!";
        tear.style.display = 'none';
        launchConfetti();
      } else if (mood === "sad") {
        imageEl.src = "../images/sad new.jpeg";
        imageEl.alt = "Justin Sad";
        status.textContent = "Justin is sad.";
        tear.style.display = 'block';
        tear.classList.remove('tear'); // re-trigger animation
        void tear.offsetWidth;
        tear.classList.add('tear');
      } else {
        imageEl.src = "../images/neutral new.jpeg";
        imageEl.alt = "Justin Neutral";
        status.textContent = "Justin is neutral.";
        tear.style.display = 'none';
      }

      input.value = '';
    }

    button.addEventListener('click', evaluateMood);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') evaluateMood();
    });
  </script>

  <div class="back-link">
    <a href="../index.html">← Back to Home</a>
  </div>
</body>
</html>
